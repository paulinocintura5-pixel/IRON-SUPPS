<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | IronSupps</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="projecto.css">

</head>

<body>


<header class="header">

    <a href="index.html" class="logo">

        <i class="fa-solid fa-dumbbell"></i>

        <div>
            <span class="logo-main">IRON</span>
            <span class="logo-sub">SUPPS</span>
        </div>

    </a>


    <nav class="navbar">

        <a href="index.html" class="nav-btn">
            <i class="fa-solid fa-house"></i>
            Início
        </a>

        <a href="produtos.html" class="nav-btn">
            <i class="fa-solid fa-store"></i>
            Produtos
        </a>

        <a href="cadastro.html" class="nav-btn active">
            <i class="fa-solid fa-user-plus"></i>
            Cadastro
        </a>

        <a href="contacto.html" class="nav-btn">
            <i class="fa-solid fa-envelope"></i>
            Contacto
        </a>

        <a href="sobre.html" class="nav-btn">
            <i class="fa-solid fa-circle-info"></i>
            Sobre
        </a>

    </nav>

</header>


<main>

    <section class="form-section">

        <div class="form-intro">

            <span class="section-label">
                FAZ PARTE DA IRONSUPPS
            </span>

            <h1>
                Cria a tua conta
            </h1>

            <p>
                Regista-te para receber novidades e acompanhar
                as novidades da IronSupps.
            </p>

        </div>


        <form class="form">

            <div class="form-row">

                <div class="input-group">

                    <label>Nome</label>

                    <input
                        type="text"
                        required
                        placeholder="O teu nome">

                </div>


                <div class="input-group">

                    <label>Apelido</label>

                    <input
                        type="text"
                        required
                        placeholder="O teu apelido">

                </div>

            </div>


            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    required
                    placeholder="exemplo@email.com">

            </div>


            <div class="input-group">

                <label>Telefone</label>

                <input
                    type="tel"
                    required
                    placeholder="+258 84 000 0000">

            </div>


            <div class="form-row">

                <div class="input-group">

                    <label>Senha</label>

                    <input
                        type="password"
                        required
                        minlength="6">

                </div>


                <div class="input-group">

                    <label>Confirmar senha</label>

                    <input
                        type="password"
                        required
                        minlength="6">

                </div>

            </div>


            <label class="checkbox">

                <input type="checkbox" required>

                Aceito os termos e condições.

            </label>


            <button type="submit"
                    class="btn-primary full">

                <i class="fa-solid fa-user-plus"></i>

                Criar conta

            </button>

        </form>

    </section>

</main>


<footer class="footer">

    <div>© 2026 IronSupps</div>

</footer>

</body>
</html>
